plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def flutterVersionCode = project.hasProperty('flutter-version-code') ? project.property('flutter-version-code') : '1'
def flutterVersionName = project.hasProperty('flutter-version-name') ? project.property('flutter-version-name') : '1.0'

android {
    namespace "com.example.namira"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.namira"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}
