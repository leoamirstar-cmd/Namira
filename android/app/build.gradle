plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def flutterVersionCode = project.hasProperty('flutter-version-code') ? project.property('flutter-version-code') : '1'
def flutterVersionName = project.hasProperty('flutter-version-name') ? project.property('flutter-version-name') : '1.0'

android {
    namespace "com.example.namira"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

  defaultConfig {
    applicationId "com.example.namira"
    minSdkVersion 24
    targetSdkVersion 34
    versionCode flutterVersionCode.toInteger()
    versionName flutterVersionName
}

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
